    <script>
      // ---------- deterministic setup ----------
      const PALETTE = { ink: "#fff6e4", gold: "#ffd477", mint: "#79dfd3", risk: "#ff947d", order: "#bba1ff" };
      const C = { x: 1240, y: 500 };
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(260726);

      const NAMED = [
        { name: "PHASEONE10841", x: 430, y: 250, color: PALETTE.gold },
        { name: "CDA23", x: 800, y: 520, color: PALETTE.ink },
        { name: "CURRENT", x: 1010, y: 175, color: PALETTE.mint },
        { name: "MARB051", x: 1540, y: 230, color: PALETTE.order },
        { name: "JAN183411", x: 1580, y: 640, color: PALETTE.risk },
        { name: "LILY", x: 1250, y: 840, color: PALETTE.mint },
      ];
      const inTextZone = (x, y) => x < 1150 && y > 640;
      const birds = NAMED.map((n) => ({ ...n, named: true }));
      let guard = 0;
      while (birds.length < 54 && guard++ < 5000) {
        const x = 80 + rnd() * 1760, y = 70 + rnd() * 940;
        if (inTextZone(x, y)) continue;
        if (birds.some((b) => Math.hypot(b.x - x, b.y - y) < 110)) continue;
        birds.push({ x, y, named: false });
      }

      const BIRD_PATH = "M4 30C13 14 24 10 35 20L41 29C49 9 64 6 82 15C67 14 57 22 49 35L42 41L37 35C27 23 16 21 4 30Z";
      const flock = document.getElementById("flock");
      birds.forEach((b, i) => {
        const dx = b.x - C.x, dy = b.y - C.y;
        b.a = (Math.atan2(dy, dx) * 180) / Math.PI;
        b.r = Math.hypot(dx, dy);
        b.w = b.named ? 78 : 38 + rnd() * 30;
        b.tilt = -22 + rnd() * 30;
        b.orbitR = 150 + rnd() * 190;
        b.orbitSpin = 150 + rnd() * 70;
        b.burstR = 620 + rnd() * 620;
        b.flapDelay = rnd() * 0.4;
        const h = (b.w * 48) / 86;
        const bo = document.createElement("div");
        bo.className = "bo" + (b.named ? " named" : "");
        bo.id = "b" + i;
        bo.innerHTML =
          '<div class="bi"><div class="bc">' +
          `<svg class="bird-svg" viewBox="0 0 86 48" style="width:${b.w}px;height:${h}px;left:${-b.w / 2}px;top:${-h / 2}px">` +
          `<path d="${BIRD_PATH}" ${b.named ? `style="stroke:${b.color}"` : ""}/>` +
          '<circle cx="40" cy="33" r="1.8"/><circle cx="44" cy="33" r="1.8"/></svg>' +
          (b.named ? `<div class="tag" style="color:${b.color}">${b.name}</div>` : "") +
          "</div></div>";
        flock.appendChild(bo);
      });

      // network: each named agent links to its 3 nearest birds; named agents form a chain
      const net = document.getElementById("net");
      const NS = "http://www.w3.org/2000/svg";
      const links = [];
      birds.forEach((b, i) => {
        if (!b.named) return;
        birds
          .map((o, j) => ({ j, d: Math.hypot(o.x - b.x, o.y - b.y) }))
          .filter((o) => o.j !== i && !birds[o.j].named)
          .sort((p, q) => p.d - q.d)
          .slice(0, 3)
          .forEach((o) => links.push({ a: i, b: o.j, strong: false }));
      });
      [0, 1, 2, 3, 4, 5, 1].forEach((n, k, arr) => { if (k > 0) links.push({ a: arr[k - 1], b: n, strong: true }); });
      links.forEach((l, k) => {
        const A = birds[l.a], B = birds[l.b];
        const ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", A.x); ln.setAttribute("y1", A.y);
        ln.setAttribute("x2", B.x); ln.setAttribute("y2", B.y);
        if (l.strong) ln.setAttribute("class", "strong");
        const len = Math.hypot(B.x - A.x, B.y - A.y);
        ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
        ln.id = "ln" + k; l.len = len; l.el = ln;
        net.appendChild(ln);
        const dot = document.createElementNS(NS, "circle");
        dot.setAttribute("r", l.strong ? 5 : 3.5); dot.setAttribute("cx", A.x); dot.setAttribute("cy", A.y);
        dot.id = "dot" + k; l.dot = dot;
        if (l.strong) dot.style.fill = PALETTE.gold;
        net.appendChild(dot);
      });

      // spread the swarm evenly around the target: slot by initial angle, keep order
      birds.map((b, i) => i).sort((p, q) => birds[p].a - birds[q].a).forEach((i, k) => {
        const b = birds[i];
        const slot = (k * 360) / birds.length - 180;
        b.a2 = b.a + (((slot - b.a) % 360) + 360) % 360 + 200;
      });

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });

      // background life
      tl.fromTo("#rings-g", { rotation: 0, scale: 0.92, transformOrigin: "1240px 500px" }, { rotation: 24, scale: 1.08, duration: 15, ease: "none" }, 0);
      tl.fromTo("#bg-band", { x: -300, rotation: -14 }, { x: 260, rotation: -10, duration: 15, ease: "none" }, 0);
      tl.fromTo("#bg-grid", { x: 0 }, { x: -120, duration: 15, ease: "none" }, 0);
      tl.fromTo("#bg-moon", { x: -260, y: 420, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 1.6, ease: "expo.out" }, 10.3);

      // birds
      const order = birds.map((b, i) => i).sort((p, q) => {
        if (birds[p].named !== birds[q].named) return birds[p].named ? -1 : 1;
        return birds[p].x - birds[q].x;
      });
      order.forEach((i, k) => {
        const b = birds[i];
        const bo = "#b" + i, bi = bo + " .bi", bc = bo + " .bc", svg = bo + " .bird-svg";
        const appear = b.named ? 0.25 + k * 0.22 : 1.0 + (k - 6) * 0.04;
        // initial placement + entrance
        tl.fromTo(bo, { rotation: b.a }, { rotation: b.a, duration: 0.01 }, 0);
        tl.fromTo(bi, { x: b.r }, { x: b.r, duration: 0.01 }, 0);
        tl.fromTo(bc, { rotation: -b.a + b.tilt, scale: 0, opacity: 0 }, { rotation: -b.a + b.tilt, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2.2)" }, appear);
        // idle hover while scattered
        tl.fromTo(svg, { y: 0 }, { y: -8, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, b.flapDelay);
        // phase 2 → swarm: spiral in toward the target
        const a2 = b.a2, a1 = a2 - 130, a3 = a2 + 50, a4 = a3 + 14;
        const t0 = 6.55 + (b.named ? 0 : rnd() * 0.35);
        tl.to(bo, { rotation: a1, duration: 1.7, ease: "power2.inOut" }, t0);
        tl.to(bi, { x: b.orbitR, duration: 1.7, ease: "power3.inOut" }, t0);
        tl.to(bc, { rotation: -a1 + b.tilt * 0.4, scale: b.named ? 0.7 : 0.85, duration: 1.7, ease: "power2.inOut" }, t0);
        // keep circling
        tl.to(bo, { rotation: a2, duration: 10.2 - (t0 + 1.7), ease: "none" }, t0 + 1.7);
        tl.to(bc, { rotation: -a2 + b.tilt * 0.4, duration: 10.2 - (t0 + 1.7), ease: "none" }, t0 + 1.7);
        tl.to(bi, { x: b.orbitR * 0.82, duration: 0.25, ease: "power2.in", yoyo: true, repeat: 1 }, 9.35);
        // phase 4: burst outward into a background flock
        tl.to(bo, { rotation: a3, duration: 1.3, ease: "expo.out" }, 10.2);
        tl.to(bi, { x: b.burstR, duration: 1.3, ease: "expo.out" }, 10.2);
        tl.to(bc, { rotation: -a3 + b.tilt, scale: 0.8, opacity: 0.32, duration: 1.3, ease: "expo.out" }, 10.2);
        tl.to(bo, { rotation: a4, duration: 3.5, ease: "none" }, 11.5);
        tl.to(bc, { rotation: -a4 + b.tilt, duration: 3.5, ease: "none" }, 11.5);
        // wing flutter (finite)
        tl.fromTo(svg, { scaleY: 1 }, { scaleY: 0.72, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 41, immediateRender: false }, b.flapDelay * 2);
      });
      // tags fade before the flock moves
      tl.to(".tag", { opacity: 0, duration: 0.35, ease: "power1.in" }, 6.3);

      // network draw: 3.5 → 5.6, then fade
      links.forEach((l, k) => {
        const t = 3.55 + (l.strong ? 0.9 + k * 0.03 : k * 0.04);
        tl.to(l.el, { strokeDashoffset: 0, duration: l.strong ? 0.55 : 0.4, ease: "power2.out" }, t);
        const B = birds[l.b];
        tl.fromTo(l.dot, { attr: { cx: birds[l.a].x, cy: birds[l.a].y }, opacity: 0 }, { attr: { cx: B.x, cy: B.y }, opacity: 1, duration: 0.6, ease: "power1.inOut" }, t + 0.2);
