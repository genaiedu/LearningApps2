    <script>
      const NS = "http://www.w3.org/2000/svg";
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(1307);
      const N = 470;
      const TAU = Math.PI * 2;
      // the wire: quadratic from (-140,700) via (960,840) to (2060,700) → x linear in t
      const wireAt = (x) => { const t = (x + 140) / 2200; return 700 + 280 * t * (1 - t); };
      const wireT = (x) => (x + 140) / 2200;

      function build() {
        const tl = gsap.timeline({ paused: true });

        // ---------- stars ----------
        const stars = document.getElementById("stars");
        for (let i = 0; i < 90; i++) {
          const c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", rnd() * 1920); c.setAttribute("cy", rnd() * 520);
          c.setAttribute("r", 0.8 + rnd() * 1.6); c.id = "st" + i;
          stars.appendChild(c);
          tl.fromTo(c, { opacity: 0.15 + rnd() * 0.3 }, { opacity: 0.9, duration: 0.8 + rnd() * 1.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, rnd() * 1.5);
        }

        // ---------- letter targets: "GRENZEN" sampled from the real font ----------
        const cv = document.createElement("canvas");
        cv.width = 1920; cv.height = 520;
        const cx = cv.getContext("2d");
        cx.fillStyle = "#000"; cx.font = "600 340px Outfit"; cx.textAlign = "center"; cx.textBaseline = "middle";
        cx.fillText("GRENZEN", 960, 270);
        const img = cx.getImageData(0, 0, 1920, 520).data;
        const filled = (x, y) => img[(y * 1920 + x) * 4 + 3] > 140;
        let area = 0;
        for (let y = 0; y < 520; y += 4) for (let x = 0; x < 1920; x += 4) if (filled(x, y)) area += 16;
        const step = Math.max(8, Math.sqrt(area / N) * 0.97);
        let pts = [];
        for (let y = step / 2, row = 0; y < 520; y += step, row++)
          for (let x = (row % 2) * step * 0.5; x < 1920; x += step)
            if (filled(Math.round(x), Math.round(y))) pts.push({ x, y: y + 60 });
        if (pts.length > N) { const k = pts.length / N; pts = Array.from({ length: N }, (_, i) => pts[Math.floor(i * k)]); }
        while (pts.length < N) { const p = pts[Math.floor(rnd() * pts.length)]; pts.push({ x: p.x + (rnd() - 0.5) * step * 0.6, y: p.y + (rnd() - 0.5) * step * 0.6 }); }

        // ---------- murmuration shapes, all continuous in u so the flock folds like a ribbon ----------
        const shape = {
          enter: (u, r, s) => ({ x: -120 - r * 520, y: 260 + u * 360 + (s - 0.5) * 120 }),
          spiral: (u, r, s) => { const a = u * TAU * 2.2 + 0.4; const R = 40 + u * 300; return { x: 720 + Math.cos(a) * R * 1.55 + (r - 0.5) * 50, y: 360 + Math.sin(a) * R * 0.62 + (s - 0.5) * 40 }; },
          ribbon: (u, r, s) => ({ x: 230 + u * 1460, y: 370 + Math.sin(u * TAU * 1.25 + 0.6) * 150 + (s - 0.5) * (40 + 90 * Math.sin(u * Math.PI)) }),
          vortex: (u, r, s) => { const a = u * TAU * 2 - 1.2; const R = 250 + (s - 0.5) * 140; return { x: 1150 + Math.cos(a) * R * 1.25, y: 350 + Math.sin(a) * R * 0.55 + (r - 0.5) * 30 }; },
          funnel: (u, r, s) => { const a = u * TAU * 3.4; const R = 30 + (1 - u) * 230; return { x: 960 + Math.cos(a) * R * 1.7 + (r - 0.5) * 40, y: 160 + u * 330 + Math.sin(a) * R * 0.25 }; },
        };
        const SEQ = [["spiral", 0.15, 1.6], ["ribbon", 1.55, 1.25], ["vortex", 2.7, 1.2], ["funnel", 3.85, 1.15]];

        const flock = document.getElementById("flock");
        const birds = [];
        for (let i = 0; i < N; i++) {
          const u = i / (N - 1), r = rnd(), s = rnd();
          const b = { i, u, r, s, size: 0.7 + rnd() * 0.5, flap: 0.09 + rnd() * 0.05 };
          b.pos = {};
          ["enter", "spiral", "ribbon", "vortex", "funnel"].forEach((k) => (b.pos[k] = shape[k](u, r, s)));
          const g = document.createElementNS(NS, "g");
          g.id = "b" + i;
          g.innerHTML =
            `<g class="fly"><g class="flap"><use class="gull" href="#gull" x="-17" y="-9.5" width="34" height="19"/></g></g>` +
            `<g class="perch" opacity="0"><ellipse class="pb" cx="0" cy="-10" rx="9" ry="7.5"/><circle class="pb" cx="6.5" cy="-19" r="5.5"/>` +
            `<path class="pb" d="M-8 -9 L-17 -3 L-7 -5Z"/><path class="pk" d="M11.5 -20 L16 -18.5 L11.5 -17Z"/><circle class="pe" cx="8" cy="-20" r="1.2"/></g>`;
          flock.appendChild(g);
          b.el = g;
          birds.push(b);
        }

        // letters: map birds (by funnel x) to points (by x) for minimal crossing
        const byX = [...birds].sort((a, c) => a.pos.funnel.x - c.pos.funnel.x);
        const ptsX = [...pts].sort((a, c) => a.x - c.x || a.y - c.y);
        byX.forEach((b, k) => (b.letter = ptsX[k]));

        // perch slots on the wire, leaving room for the hero bird in the middle
        const slots = [];
        for (let x = 110; x <= 1810; x += 36) if (x < 850 || x > 1070) slots.push(x);
        const byLetterX = [...birds].sort((a, c) => a.letter.x - c.letter.x);
        const every = byLetterX.length / slots.length;
        slots.forEach((x, k) => { const b = byLetterX[Math.floor(k * every + every / 2)]; b.perchX = x; });

        const bank = (dx) => Math.max(-24, Math.min(24, dx / 18));

        birds.forEach((b) => {
          const sel = "#b" + b.i, fly = sel + " .fly", flap = sel + " .flap", perch = sel + " .perch";
          const wave = b.u * 0.42;
          let prev = b.pos.enter;
          tl.fromTo(sel, { x: prev.x, y: prev.y, scale: b.size, rotation: 0 }, { x: prev.x, y: prev.y, scale: b.size, rotation: 0, duration: 0.01 }, 0);
          SEQ.forEach(([k, t, d]) => {
            const p = b.pos[k];
            tl.to(sel, { x: p.x, y: p.y, rotation: bank(p.x - prev.x), duration: d, ease: "sine.inOut" }, t + wave);
            prev = p;
          });
          // the word
          const L = b.letter;
          const tL = 5.0 + (L.x / 1920) * 0.55 + b.r * 0.12;
          tl.to(sel, { x: L.x, y: L.y, rotation: 0, scale: 0.95 + b.r * 0.15, duration: 1.15, ease: "power3.inOut" }, tL);
          tl.to(sel, { y: L.y - 5, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.6 + b.s * 0.3);
          // flutter
          tl.fromTo(flap, { scaleY: 1 }, { scaleY: 0.55, duration: b.flap, ease: "sine.inOut", yoyo: true, repeat: Math.floor(10.5 / b.flap), immediateRender: false }, b.r * 0.2);
          // release
          const tR = 8.95 + (1 - L.y / 600) * 0.25 + b.r * 0.35;
          if (b.perchX !== undefined) {
            const px = b.perchX, py = wireAt(px);
            b.perchY = py;
            tl.to(sel, { keyframes: [
              { x: L.x + (px - L.x) * 0.35, y: L.y - 70 - b.s * 60, rotation: bank(px - L.x), scale: 1.1, duration: 0.55, ease: "sine.out" },
              { x: px, y: py, rotation: 0, scale: 1.45, duration: 0.9, ease: "power2.inOut" },
            ] }, tR);
            const land = tR + 1.45;
            tl.to(fly, { opacity: 0, duration: 0.08, ease: "none" }, land - 0.05);
            tl.to(perch, { opacity: 1, duration: 0.08, ease: "none" }, land - 0.05);
            tl.fromTo(perch, { rotation: -14, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 0.6, ease: "elastic.out(1.2, 0.4)", immediateRender: false }, land - 0.05);
            b.land = land;
          } else {
            const ex = 2050 + b.r * 380, ey = -140 + b.s * 420;
            tl.to(sel, { x: ex, y: ey, rotation: -12 + b.r * 10, duration: 1.5 + b.s * 0.5, ease: "power2.in" }, tR);
          }
        });

        // ---------- the wire is drawn by a pen of light ----------
        const wire = document.getElementById("wire"), glow = document.getElementById("wire-glow");
        const len = wire.getTotalLength();
        const dark = document.getElementById("wire-dark");
        [wire, glow, dark].forEach((p) => { p.style.strokeDasharray = len; });
        tl.fromTo([wire, glow, dark], { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.5, ease: "power2.inOut" }, 4.0);
        const penKeys = [];
        const pe = gsap.parseEase("power2.inOut");
        for (let k = 1; k <= 30; k++) { const x = -140 + 2200 * pe(k / 30); penKeys.push({ attr: { cx: x, cy: wireAt(x) }, duration: 1.5 / 30, ease: "none" }); }
        tl.fromTo(["#pen", "#pen-halo"], { opacity: 0 }, { opacity: 1, duration: 0.15 }, 3.95);
        tl.to(["#pen", "#pen-halo"], { keyframes: penKeys }, 4.0);
        tl.to(["#pen", "#pen-halo"], { opacity: 0, duration: 0.3, ease: "power1.in" }, 5.45);

        // ---------- hero lands, the wire gives a little ----------
        tl.fromTo("#hero", { x: 520, y: -520, rotation: 24, opacity: 0 }, { x: 0, y: 0, rotation: 0, opacity: 1, duration: 1.15, ease: "power3.out" }, 10.85);
        tl.fromTo("#hero-wing", { rotation: -34, transformOrigin: "80% 30%" }, { rotation: 0, duration: 0.14, ease: "sine.inOut", yoyo: true, repeat: 7 }, 10.85);
        const D = 16; // wire dip at hero landing
        const dip = (v) => `M -140 700 Q 960 ${840 + v} 2060 700`;
        tl.to([wire, glow, dark], { keyframes: [
          { attr: { d: dip(D) }, duration: 0.18, ease: "power2.out" },
          { attr: { d: dip(-D * 0.45) }, duration: 0.3, ease: "sine.inOut" },
          { attr: { d: dip(D * 0.2) }, duration: 0.3, ease: "sine.inOut" },
          { attr: { d: dip(0) }, duration: 0.35, ease: "sine.out" },
        ] }, 11.95);
        tl.to("#hero", { keyframes: [
          { y: D * 0.5, duration: 0.18, ease: "power2.out" },
          { y: -D * 0.45 * 0.5, duration: 0.3, ease: "sine.inOut" },
          { y: D * 0.2 * 0.5, duration: 0.3, ease: "sine.inOut" },
          { y: 0, duration: 0.35, ease: "sine.out" },
        ] }, 11.95);
        birds.forEach((b) => {
          if (b.perchX === undefined) return;
          const t = wireT(b.perchX), w = 2 * t * (1 - t);
          tl.to("#b" + b.i, { keyframes: [
            { y: b.perchY + D * w, duration: 0.18, ease: "power2.out" },
            { y: b.perchY - D * 0.45 * w, duration: 0.3, ease: "sine.inOut" },
            { y: b.perchY + D * 0.2 * w, duration: 0.3, ease: "sine.inOut" },
            { y: b.perchY, duration: 0.35, ease: "sine.out" },
          ] }, Math.max(11.95, b.land + 0.1));
        });
        tl.fromTo("#hero-head", { rotation: 0, transformOrigin: "40% 80%" }, { rotation: -8, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 13.0);
        tl.fromTo("#hero-eye", { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: 0.1, duration: 0.08, ease: "power1.in", yoyo: true, repeat: 1 }, 14.1);

        // ---------- sky ----------
        tl.fromTo("#sun", { y: -60, scale: 0.92 }, { y: 150, scale: 1.04, duration: 15, ease: "sine.inOut" }, 0);
        tl.fromTo("#haze", { opacity: 0.5 }, { opacity: 1, duration: 15, ease: "none" }, 0);
