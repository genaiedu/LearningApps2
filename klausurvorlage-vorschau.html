<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blankoklausur · Seitenvorschau</title><style>*{box-sizing:border-box}body{margin:0;background:#343434;font:14px Arial,sans-serif;color:white}nav{position:sticky;top:0;display:flex;align-items:center;justify-content:center;gap:.7rem;flex-wrap:wrap;background:#202020;padding:.6rem;z-index:1}button,select{font:inherit;padding:.4rem;border:1px solid #999;border-radius:4px;color:#111;background:white}button:disabled{opacity:.5}a{color:white}main{padding:1rem;max-width:880px;margin:auto}img{display:block;width:100%;height:auto;background:white;box-shadow:0 2px 10px #111}#status{min-width:6rem;text-align:center}.note{font-size:.85rem;text-align:center;color:#ddd}@media print{nav,.note{display:none}body{background:white}main{padding:0}img{box-shadow:none}}</style></head><body><nav aria-label="Seitenwahl"><button id="previous" aria-label="Vorherige Seite">←</button><select id="page" aria-label="Seite auswählen"><option value="1">1 · Vorblatt</option><option value="2">2 · Aufgabenblatt</option><option value="3">3 · Materialien</option><option value="4">4 · Lehrkraft: Aufgabenstellung</option><option value="5">5 · Lehrkraft: Quellen</option><option value="6">6 · Erwartungshorizont</option><option value="7">7 · Bewertungsbogen</option><option value="8">8 · Gesamtnote</option><option value="9">9 · Notenfindung</option></select><button id="next" aria-label="Nächste Seite">→</button><span id="status" aria-live="polite"></span><a href="downloads/Blankoklausur_Naturwissenschaften.pdf" download>PDF herunterladen</a></nav><main><img id="sheet" src="images/klausurvorlage/seite-1.png" alt="Blankoklausur – Vorblatt"><p class="note">Seitenansicht der PDF. Die heruntergeladene PDF enthält ausfüllbare Felder.</p></main><script>const page=document.getElementById('page'),sheet=document.getElementById('sheet'),prev=document.getElementById('previous'),next=document.getElementById('next');function show(n){page.value=String(Math.max(1,Math.min(9,n)));const v=Number(page.value);sheet.src='images/klausurvorlage/seite-'+v+'.png';sheet.alt='Blankoklausur – '+page.selectedOptions[0].textContent;prev.disabled=v===1;next.disabled=v===9;document.getElementById('status').textContent='Seite '+v+' von 9';window.scrollTo(0,0)}page.addEventListener('change',()=>show(Number(page.value)));prev.addEventListener('click',()=>show(Number(page.value)-1));next.addEventListener('click',()=>show(Number(page.value)+1));show(Number(new URLSearchParams(location.search).get('seite'))||1);</script></body></html>
